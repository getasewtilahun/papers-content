name: Notify Users of New Content

on:
  push:
    branches:
      - main
    paths:
      - 'catalog.json'
      - '*.json'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase Admin
        run: npm install firebase-admin --no-package-lock

      - name: Send Notification via Firebase Admin SDK
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");
          const admin = require("firebase-admin");

          let changedFiles = [];
          try {
            changedFiles = execSync("git diff --name-only HEAD~1 HEAD").toString().split("\n");
          } catch (e) {
            changedFiles = fs.readdirSync(".").filter(f => f.endsWith(".json"));
          }

          const jsonFiles = changedFiles.map(f => f.trim()).filter(f => f.endsWith(".json") && f !== "catalog.json" && fs.existsSync(f));

          const targetFile = jsonFiles.length > 0 ? jsonFiles[0] : "on-the-incarnation.json";
          const workId = path.parse(targetFile).name;
          const data = JSON.parse(fs.readFileSync(targetFile, "utf8"));

          const title = data.title || "New Theological Work";
          const author = data.author ? data.author.name : "";
          const body = author 
            ? `«${title}» by ${author} is now available in Papers.`
            : `«${title}» is now available in Papers.`;

          console.log(`Sending push notification for ${title} (${workId})...`);

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount)
          });

          admin.messaging().send({
            topic: "new_content",
            notification: {
              title: "New Publication Available",
              body: body
            },
            data: {
              workId: workId
            }
          })
          .then((response) => {
            console.log("Successfully sent notification:", response);
          })
          .catch((error) => {
            console.error("Error sending notification:", error);
            process.exit(1);
          });
          '
